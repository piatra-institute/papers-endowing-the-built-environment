      units: "overdue component-years"
      conditions: "Two-year approval delay for each due intervention, otherwise financial baseline."
  - id: combined-owner-calls
    kind: computation
    passage: "Further runs increase relative construction-cost growth, double fees, and combine the stresses. Separate policies permit owner calls or whole-apartment sales. In the combined rental case, calls amount to EUR 6.548 million over the simulated period. They remove funding-related deferrals but cannot remove the assumed approval delay. Liquidation eventually sells all 25 retained units, reducing future rent and still failing to establish continuation funding. Neither policy is concealed inside the baseline."

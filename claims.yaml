  - id: matched-control
    kind: interpretation
    passage: "This equivalence matters to the argument. An endowment can change the legal destination of value or the incentives to withdraw it. It cannot create an investment advantage that disappears as soon as the comparison uses the same portfolio. Whether the ordinary reserve is legally permitted to hold that portfolio is a separate question, addressed below."
    rationale: "Tests compare entire annual ledgers of financial and matched-reserve treatments. Same initial state, cash flows and returns yield identical interventions and wealth; institutional benefit must be established separately."
  - id: rental-extra-opening
    kind: computation
    passage: "The baseline also permits an initial-funding calculation. Holding the retained apartments fixed, about EUR 519,418 of additional opening cash is required for the rental arrangement to execute the scheduled work and satisfy the final continuation check. The 2% liquid reserve requires about EUR 2.289 million beyond the common starting capital. These are conditional funding thresholds for this model. They are not prudent capital recommendations, and neither includes every future adaptation liability. Committing that extra cash at handover would reduce the developer's return or require another identified contributor; it cannot be added without reopening the launch account."
    evidence:
      file: "simulation/output/results.json"
      run_id: "renewal"
      pointer: "/minimum_additional_cash/rental"
      reported: "519,418"
      scale: 1
      decimals: 0
      units: "real EUR"
      conditions: "Binary funding search: baseline work all timely, no arrears and final continuation gap <= EUR 0.01; retained units fixed."

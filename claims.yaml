claims:
  - id: abstract-scope
    kind: interpretation
    passage: "A building can be paid for at completion and still lack a credible provision for the work that will keep it usable. This paper examines an endowment dedicated to that continuing obligation, including a development model that retains rental apartments to support common renewal. A launch constraint prices retained assets at their foregone selling value. A reproducible 60-year model then compares rental income, liquid reserves and financial investments with equal initial dedicated capital, recurring component work and a rolling 20-year funding assessment. Under the illustrative baseline, the rental endowment retains cash and property at year 60 but has overdue work and a continuation-funding gap. A higher-return financial portfolio meets the baseline obligations; an ordinary reserve holding the same portfolio produces identical results. Endowment therefore supplies neither free capital nor a financial advantage by designation. Its possible contribution lies in sustaining a commitment through changes of owners, managers and circumstances. The second half develops a commercial stewardship institution with segregated client assets, independent engineering, explicit fees, portable records and a replaceable manager. Bounded legal comparisons show why such an institution would require local mandates rather than a universal ownership wrapper. Continued service, affordability and environmental benefit remain separate objectives requiring explicit decisions."
    rationale: "Abstract synthesizes the conditional model and separately proposed institution. Equal-portfolio equivalence is exact; no probability, perpetual-solvency or investment-performance claim."
  - id: endowment-definition
    kind: definition
    passage: "An endowment dedicated to a building is one possible arrangement. Here, an endowment means assets whose use is committed to a continuing service purpose, under enforceable rules about expenditure and disposition. It need not prohibit every sale of capital. A rigid ban on selling an unproductive asset could undermine the purpose it was meant to protect. What matters is the destination of value and the obligations attached to it."
    rationale: "Purpose dedication rather than an absolute ban on asset sales is the working definition. Enforceability is a design requirement, not universal legal availability."
  - id: strongest-rival
    kind: interpretation
    passage: "The strongest alternative is an ordinary reserve financed adequately and administered well. It should not be weakened in the comparison by giving it less money, less competence or fewer powers. If both arrangements commit the same resources to the same obligations, their difference must be located in investment choices, legal durability, incentives or administrative performance. A new name does not itself improve any of them."
    rationale: "An adequately funded ordinary reserve is the comparator. Resources, obligations and competence may not be reduced merely to favour the proposal."
  - id: service-purpose
    kind: definition
    passage: "For this reason, “maintaining capital” is too ambiguous to serve as the objective without further specification. We use continued service as the governing purpose: the asset should remain capable of performing an agreed function at a stated standard, or undergo an authorized adaptation or exit when that purpose is no longer defensible. Financial provision is assessed against the work required by that purpose."
    rationale: "Continued service is the proposed governing objective; capital price, fund balance and service capacity are not identified."
  - id: depreciation-cash
    kind: interpretation
    passage: "Accounting depreciation alone does not supply cash. It allocates costs under an accounting convention. A reserve is an actual claim on resources, and a maintenance plan is a schedule of actions. They can inform one another, but none substitutes for the others. Refinancing can move the date and bearer of a payment; its proceeds come with another obligation."
    rationale: "Accounting allocation does not itself create usable resources. No jurisdiction-specific accounting rule is asserted."
  - id: lifecycle-cost-budget
    kind: source
    passage: "Lifecycle costing provides a disciplined way to compare expenditures over time. NIST's manual distinguishes inflation adjustment from discounting and, importantly, present-value evaluation from provision for year-by-year disbursements [@nist2025, secs. 3.3.1-3.3.3]. A project with an acceptable lifecycle cost can still lack money when a particular invoice falls due. The analysis below retains both the time path and the total commitment."
    evidence:
      citation_id: "nist2025"
      locator: "Chapter 3, sections 3.3.1-3.3.3, pp. 32-38"
      verified: true
      verification_note: "Read NIST's distinctions between inflation and discounting, and present-value evaluation and budget provision. No handbook rate is used as a current local financing recommendation."
  - id: endowment-other-resources
    kind: source
    passage: "The investment problem also depends on the service being financed. Merton's treatment of university endowments relates investment policy to other institutional resources and uncertain activity costs [@merton1991, abstract]. Applied here, the relevant question is how income and assets behave when the building needs money. Apartments in the same building may lose rental income at precisely the time a serious defect increases expenditure."
    evidence:
      citation_id: "merton1991"
      locator: "Working-paper abstract"
      verified: true
      verification_note: "Read NBER abstract, including activity costs and other institutional resources. The correlated rental/repair application is our hypothesis, not an empirical estimate attributed to Merton."
  - id: land-trust-precedent
    kind: source
    passage: "Endowed stewardship already has close precedents. The Land Trust accepts land together with financial provision for its continuing management [@landtrust]. The Parks Trust describes a property endowment established alongside its parkland responsibilities and continuing support from property and investment income, as well as other sources [@parkstrust]. These examples establish that the institutional family exists. They do not demonstrate that a particular apartment scheme can finance itself indefinitely."
    evidence:
      citation_id: "landtrust"
      locator: "Endowment service page, opening four paragraphs"
      verified: true
      verification_note: "Read official description of land transfer with invested support for continuing management. Marketing assurances about removing risk are not repeated."
  - id: parks-trust-precedent
    kind: source
    passage: "Endowed stewardship already has close precedents. The Land Trust accepts land together with financial provision for its continuing management [@landtrust]. The Parks Trust describes a property endowment established alongside its parkland responsibilities and continuing support from property and investment income, as well as other sources [@parkstrust]. These examples establish that the institutional family exists. They do not demonstrate that a particular apartment scheme can finance itself indefinitely."
    evidence:
      citation_id: "parkstrust"
      locator: "Our Story, About The Parks Trust"
      verified: true
      verification_note: "Read official account of property endowment and property/investment income; other continuing income acknowledged. No apartment scheme's indefinite solvency inferred."

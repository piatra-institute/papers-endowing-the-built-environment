      units: "apartments"
      conditions: "Combined rental stresses with whole-unit sales, no calls; sales reduce next-period rent."
  - id: simulation-scope
    kind: interpretation
    passage: "These results do not rank actual financial products or establish a probability of success. The model has no calibrated return distribution, engineering hazard function or local tax system. It also omits transaction costs on emergency property sales, making that option unusually favourable. Its useful result is the separation of launch resources, annual liquidity, physical execution and future provision. An institutional proposal has to explain how it will maintain those relations when the original actors have left."
    rationale: "No calibrated returns, hazards or local tax model. Constant-price emergency property sales omit transaction costs, favouring liquidation. Accounting/funding distinctions, not investment rankings."
  - id: company-boundary
    kind: normative
    passage: "A worldwide stewardship company could supply continuity without owning every client asset. The proposed boundary is straightforward: client entities retain ownership and custody of their dedicated resources; the company sells the continuing professional service needed to keep the plan, accounts and decisions coherent."
    rationale: "Proposed service company separate from client ownership/custody; not an empirically demonstrated global business or executable universal entity."
  - id: mandate-duties
    kind: normative
    passage: "Its mandate would join tasks often discussed separately. It would maintain an asset register, arrange independent condition assessments, translate those assessments into dated work and cash requirements, monitor permitted investments, prepare decisions for the competent local body, supervise procurement within delegated limits, and report the consequences of deferral. The promise would be to perform these duties competently and disclose gaps. A guarantee that every client will always be funded would be a different product, requiring explicit capital, insurance and limits."
    rationale: "Proposed connection of engineering, finance, authority and records; a solvency guarantee would be a separate capitalized/insured product."
  - id: authority-allocation
    kind: normative
    passage: "This is a proposed division of functions, not a universal legal entity chart. Small buildings may combine some roles through service contracts. What should not disappear is the ability to distinguish a recommendation, an authorization, a payment and an inspection of the completed work."
    rationale: "Role table proposes separation of recommendation, authorization, payment and inspection, not a universal legal chart. Local powers and independent conflict controls required."
  - id: emergency-delegation
    kind: normative
    passage: "Emergency authority needs definition before an emergency. A manager should have an agreed route to secure the site, obtain competent assessment and initiate work within lawful powers. Spending limits, notification duties and subsequent review can control that authority. Requiring a fresh discretionary vote for every urgent intervention can make an otherwise well-funded structure unable to act."
    rationale: "Prior delegation with limits, notification and review proposed; statutory duties not overridden."
  - id: portable-records
    kind: normative
    passage: "Replaceability should be practical. The client needs continuing access to the component register, contracts, inspection evidence, accounts, models and assumptions in usable formats. Bank and custody relationships should not vanish with the manager's software account. A replacement provider needs records of unresolved defects and unexecuted decisions, not merely the previous year's balance sheet."
    rationale: "Proposed access/custody/record portability makes removal practical; does not defeat insolvency or creditor law."
  - id: resident-voice
    kind: normative
    passage: "This model also needs scrutiny from the people living with its decisions. An owner vote is not necessarily a tenant voice. Residents need a route to report a failing service, obtain reasons for a deferral, and challenge an inaccessible or unsafe intervention. Technical review can determine whether a component is adequate; it cannot by itself decide whose disruption or loss of access is acceptable."
    rationale: "Tenant interests may differ from voting owners. Proposed reporting, reasons and challenge routes supplement technical judgment."
  - id: polycentric-scale
    kind: source
    passage: "Ostrom's discussion of polycentric service provision gives a useful caution about organizational scale: activities with different production requirements need not be assigned to the same size of provider [@ostrom2009, pp. 1-4]. The proposed application here is a common professional infrastructure serving distinct local mandates. It is not a claim that centralizing ownership would improve all of those mandates."
    evidence:
      citation_id: "ostrom2009"
      locator: "Revised Nobel lecture draft, pp. 1-4, introduction and section 2A"
      verified: true
      verification_note: "Read archived draft on task-dependent production scale and polycentric services. Paraphrase only, no quotation. Commercial stewardship application is our proposal, not Ostrom's finding."
  - id: pooling-boundary
    kind: normative
    passage: "Shared administration does not require shared investment ownership. A company can operate a common reporting system while every client retains separate accounts and assets. Pooled investment is a further decision involving custody, allocation, liquidity and exit rules. Cross-subsidy is another decision again. It should not emerge because a manager transfers money from a new client's reserve to meet an old client's repair bill."
    rationale: "Shared professional systems do not require shared asset ownership. Pooling/mutual support require separate authorized claims, liquidity and exit rules."
  - id: currency-risk
    kind: interpretation
    passage: "A global investment policy also encounters currency mismatch. Income earned elsewhere must purchase labour and materials where the building stands. Diversification across countries can reduce some concentration while introducing exchange-rate, tax and transfer risks. The simple euro model abstracts from these. A real mandate would match near-term liabilities to usable local liquidity and state who bears any remaining mismatch."
    rationale: "Conceptual liability-matching limit omitted by euro model. Diversification can introduce mismatches requiring local liquidity; no numerical cross-currency benefit asserted."
  - id: romanian-repair-fund
    kind: source
    passage: "In Romania, Law 196/2018 directs income from common property, including bank interest, to the association's repair fund and requires annual repair-fund provision. It also addresses separate administration and transfer of records when managers change [@romania2018, arts. 66, 69-71]. This supplies a relevant commitment structure. It does not turn separately titled apartments retained by a developer into common property, or automatically dedicate their rents to the association. That transfer of value requires its own legal mechanism."
    evidence:
      citation_id: "romania2018"
      locator: "Articles 66(1)(g), 66(3), 69, 70 and 71"
      verified: true
      verification_note: "Read official text: separate administration, manager handover, common-income/interest dedication and repair provision. No automatic dedication of separately titled rental apartments. Qualified local review required."
  - id: nyc-adaptation
    kind: source
    passage: "New York City illustrates how the obligation itself can change. Local Law 97 introduces emissions requirements, with different treatment for categories of affordable and regulated housing [@nyc97]. A fund concerned only with replacing components like for like may miss required adaptation. This example should not be mistaken for a statement that every condominium faces the same reserve rule or compliance route."
    evidence:
      citation_id: "nyc97"
      locator: "HPD LL97 guidance, introduction and Article 321 discussion"
      verified: true
      verification_note: "Read official guidance on emissions duties and different affordable/regulated housing categories. Not a universal reserve-fund rule."
  - id: maharashtra-investment-powers
    kind: source
    passage: "For a co-operative structure in Maharashtra, section 70 of the Co-operative Societies Act specifies investment and deposit channels and routes dependent on rules or government orders [@maharashtra1960, sec. 70]. The model's diversified financial portfolio cannot simply be assigned to a Mumbai housing society without establishing the applicable permissions. Entity classification and current housing-specific provisions matter; another Indian state's regime is not interchangeable with this one."
    evidence:
      citation_id: "maharashtra1960"
      locator: "Section 70, printed page 47, official India Code text"
      verified: true
      verification_note: "Read deposit/investment channels and routes subject to rules/orders. Entity classification/current housing-specific provisions need separate review; no unrestricted securities authority asserted."
  - id: shanghai-fund-system
    kind: source
    passage: "Shanghai's housing administration describes, in its 2024 response on special maintenance funds, procedures for authorized expenditure and audits, and the use of deposits and government-bond routes for fund income [@shanghai2024, secs. I-III]. This is evidence of a specific, administered renewal-fund system. It is not permission to replace that system with an unrestricted global investment account. The dated response also cannot settle every subsequent rule change."
    evidence:
      citation_id: "shanghai2024"
      locator: "Official response dated 29 May 2024, sections I-III"
      verified: true
      verification_note: "Read dated authorized-use, audit and deposit/government-bond account. Not a certification of subsequent rules."
  - id: kenya-powers
    kind: source
    passage: "Kenya's Sectional Properties Act combines duties to maintain common property with funding obligations. It restricts the corporation's trading powers and conditions investment of money not immediately required on trustee-permitted investments and a special resolution [@kenya2020, secs. 20, 21 and 35]. A Nairobi rental endowment would therefore need an entity and contractual arrangement whose powers actually cover the proposed activity. The condominium corporation should not be presumed capable of any business that might generate useful income."
    evidence:
      citation_id: "kenya2020"
      locator: "Sections 20, 21 and 35; official endpoint resolves to 31 December 2022 consolidation"
      verified: true
      verification_note: "Read repair/funding duties, trading restriction and conditioned investment power. Rental activity requires an entity/contract with actual authority."
  - id: company-break-even
    kind: computation
    passage: "A simple example makes the scale problem visible. With an annual fee of EUR 15,000, direct service cost of EUR 9,000 per client and central annual costs of EUR 3 million, the operating break-even point is 500 clients. These are hypothetical costs, not a business valuation. Onboarding, working capital, unusual investigations and liability exposure could increase the requirement."
    evidence:
      file: "simulation/output/results.json"
      run_id: "renewal"
      pointer: "/steward/break_even_clients"
      reported: "500"
      scale: 1
      decimals: 0
      units: "client mandates"
      conditions: "Hypothetical EUR 15,000 annual fee minus EUR 9,000 direct cost; EUR 3 million central cost. Excludes onboarding/working capital/unusual liabilities."
  - id: company-cost-inputs
    kind: assumption
    passage: "A simple example makes the scale problem visible. With an annual fee of EUR 15,000, direct service cost of EUR 9,000 per client and central annual costs of EUR 3 million, the operating break-even point is 500 clients. These are hypothetical costs, not a business valuation. Onboarding, working capital, unusual investigations and liability exposure could increase the requirement."
    rationale: "Fee/direct/central costs hypothetical, not a valuation or empirically established scale economy."
  - id: fee-incentives
    kind: normative
    passage: "Fees based entirely on assets under management can reward accumulation even when work should proceed. Fees based entirely on project expenditure can reward unnecessary works. A fixed service fee with disclosed charges for genuinely additional work is easier to inspect, though it still requires controls on scope and quality. The contract should identify which ordinary tasks are included, which events justify an additional charge, and who approves it."
    rationale: "Fixed ordinary fee plus disclosed additional work proposed with quality/conflict controls. No remuneration formula eliminates judgment or incentives."
  - id: affordability-distinction
    kind: interpretation
    passage: "Affordability also needs a separate account. Dedicating rent to common renewal can protect a building while leaving tenants unable to afford it. In the retained-apartment example, renters may help finance common assets whose value accrues partly to owner-occupiers. The distribution might be accepted, offset through rent policy, or changed through beneficiary rights. Its fairness cannot be inferred from the account's solvency."
    rationale: "Solvency does not establish equitable distribution; tenant payments and ownership gains need their own account."
  - id: failure-distinction
    kind: normative
    passage: "Manager failure is different from client underfunding. In the first case, separate custody and portable records should permit a successor to take over without treating the client assets as working capital of the failed company. In the second, replacing a manager may improve administration but cannot supply missing economic resources. Neither arrangement can contract away applicable creditor priorities, residents' rights or statutory duties."
    rationale: "Separate custody/portability design aims cannot erase creditor priorities, resident rights, statutory duties or underfunding."
  - id: adaptation-exit
    kind: normative
    passage: "Adaptation is harder than replacement. A building may need different access, lower energy demand, a new use or a different relationship to its surroundings. The beneficiaries of the original endowment may disagree about those changes. A durable arrangement therefore needs a procedure for revising purposes, involving affected residents and competent public authorities where required, while preserving the dedication of value as far as law and circumstances permit."
    rationale: "Revisable purpose and lawful participation proposed; perpetual physical preservation not assumed desirable."
  - id: environmental-distinction
    kind: interpretation
    passage: "Environmental claims need their own comparison. Retaining an old component, replacing it with a more efficient one, or redeveloping the site can have different embodied and operating consequences. A well-funded renewal system can finance environmentally poor decisions just as readily as good ones if its mandate asks only for financial continuity. Engineering assessment, environmental assessment and resident consent should meet in an explicit decision rather than be collapsed into one financial indicator."
    rationale: "Financial continuity cannot establish environmental benefit. Embodied/operating alternatives require an independent comparison not conducted here."
  - id: bounded-pilot
    kind: normative
    passage: "An initial implementation would be judged best through a bounded pilot: a small number of buildings with established title, independently assessed liabilities, disclosed capital, and a contractual route to change the manager. The pilot would test records, inspections, decision timing, resident access and actual costs. It would not establish perpetual solvency, but it could expose the administrative failures that a long projection leaves abstract."
    rationale: "Administrative pilot would test service delivery and costs, not perpetual solvency."
  - id: finite-horizon-limit
    kind: interpretation
    passage: "The accompanying implementation publishes the input assumptions, annual ledgers, intervention histories, fixed stress paths and unit tests. The continuation calculation discounts future net costs at the relevant treatment's assumed real return and takes the largest cumulative deficit within the rolling window. It is a conditional liquidity requirement, not an actuarial reserve or an infinite-horizon solvency proof."
    rationale: "Continuation discounting conditional on assumed returns and 20-year window, not an actuarial or infinite-horizon result."
  - id: no-hidden-rescue
    kind: assumption
    passage: "The no-call treatments are deliberately hard boundaries: once obligations become unpaid, the subsequent ledger records the shortfall rather than assuming an undisclosed rescue. Authorized calls and apartment liquidation are separate policies. Additional calls are also reported at present value, using the common 2% real comparison rate. There is no random simulation from which a success probability could legitimately be estimated."
    rationale: "Negative balances preserve unpaid obligations; calls/sales are separate. Present-value calls use the common 2% real rate."

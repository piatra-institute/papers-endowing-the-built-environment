  - id: net-rent-boundary
    kind: assumption
    passage: "The income assumption requires similar care. The EUR 4,800 is after the rental apartment's own operating costs, interior renewal and operating taxes, but before the shared building work and the steward's fee. The model funds common obligations for the whole building, including the retained apartments. It does not both deduct their common-property share from rent and charge the whole expense again below it."
    rationale: "EUR 4,800 per unit is net of private operating/interior/tax costs but before common renewal and fees. Common expenses are not deducted twice. Project tax and development finance remain outside the model."
  - id: equal-initial-capital
    kind: computation
    passage: "The simulation begins with equal dedicated economic capital of EUR 3.3 million in every treatment. The rental endowment holds 25 apartments valued at EUR 3 million and EUR 300,000 in cash. The conventional liquid reserve holds the full EUR 3.3 million. The financial endowment also holds EUR 3.3 million in liquid investments. Initial component condition and whole-building obligations are identical."
    evidence:
      file: "simulation/output/results.json"
      run_id: "renewal"
      pointer: "/launch/dedicated_capital"
      reported: "3.3"
      scale: 0.000001
      decimals: 1
      units: "real EUR"
      conditions: "Deterministic illustrative baseline; constant purchasing-power euros, stated config.json assumptions, no automatic owner injections or asset sales."
  - id: return-assumptions
    kind: assumption
    passage: "The conventional reserve and rental cash earn an assumed real return of 2%. The financial portfolio earns an assumed 4% real in the baseline. These rates describe different portfolio assumptions, not rewards for institutional virtue. A fourth treatment gives the conventional reserve exactly the financial portfolio's return path; it is an equivalence control."
    rationale: "2% real cash and 4% real financial returns are scenario inputs, not estimated yields. Matched reserve uses the identical financial return path."
  - id: component-assumptions
    kind: assumption
    passage: "The horizon is 60 years, with a fresh 20-year funding assessment at every annual review. Twenty years is a planning window, not a demolition interval. Four recurring component programmes represent lifts, the roof, the facade and shared services. Their assumed replacement intervals are respectively 20, 25, 30 and 30 years. Initial intervention costs are EUR 350,000, EUR 450,000, EUR 700,000 and EUR 550,000. Routine work begins at EUR 30,000 annually, and the common stewardship fee is EUR 15,000."
    rationale: "60-year horizon, rolling 20-year window, four declared intervention lives/costs, annual routine expense and common fee are in config.json; none is engineering calibration."
  - id: price-basis
    kind: assumption
    passage: "All cash is expressed in constant purchasing-power euros. Construction and routine-work costs increase by 1% annually relative to that purchasing-power measure in the baseline; net rents remain constant in real terms. The return assumptions are after investment costs and before the separately charged steward fee. No borrowing, asset appreciation or automatic new owner contribution is included. The rates, lives and costs are illustrative inputs, not engineering recommendations."
    rationale: "Constant purchasing-power euros, 1% real construction/routine escalation, fixed real rents, returns after investment costs but before steward fee. No borrowing, appreciation or hidden owner support."
  - id: cash-identity
    kind: definition
    passage: "where $Y_t$ is rental income, $L_t$ an explicit owner injection, $S_t$ proceeds from an authorized asset sale, $C_t$ routine and executed renewal expenditure, and $H_t$ the fee. Returns and income are credited before that year's expenditures. Separate state variables record component ages and overdue work."
    rationale: "Annual accounting credits income/return before expenses; calls and sales only under explicit policies. simulate() reconciles every row, negative balances treated as arrears earning no return."
  - id: physical-state
    kind: definition
    passage: "When a component becomes due, its replacement occurs only if funding and approval permit. Otherwise it remains overdue. Replacement resets age when the work actually happens, rather than when it was originally scheduled. Negative operating balances remain recorded as unpaid obligations and earn no return. They are a failure indicator, not a source of free credit or an assumption that service can safely continue."
    rationale: "Funding and approval required. Actual execution resets age; overdue work and arrears are failures, not evidence that service can safely continue."
  - id: overdue-measure
    kind: definition
    passage: "An overdue component-year is deliberately a modest measure. It counts a year beyond an assumed intervention date. It is not a measured outage, a probability of structural failure, or a claim that all four components have equal consequences for residents. A practical system would need condition inspections, criticality and service-specific safety thresholds."
    rationale: "Count of years beyond an assumed intervention date; not an outage probability or criticality-weighted service measure."
  - id: continuation
    kind: definition
    passage: "The rolling assessment calculates the minimum opening liquidity required to perform the next window's projected work on time. It uses the maximum cumulative discounted funding deficit, so the date of expenditure matters. Future shocks are not known in advance. At the final year, the calculation continues beyond the reporting horizon using actual component ages. Property value is reported separately; it is not added to future rental income to finance the same obligation twice."
    rationale: "Minimum liquidity is maximum cumulative discounted net deficit in the next 20 years, with actual terminal ages and no foreknowledge of dated shocks. Separate property value cannot also finance counted rents."
  - id: rental-first-overdue
    kind: computation
    passage: "The baseline rental endowment first leaves work overdue in year 60. Its liquid balance is still EUR 425,705, and the apartments remain held. Yet its projected continuation-funding gap is EUR 1.306 million. A report displaying only cash plus property value would omit the failure to execute due work and the shortfall in the next funding window."
    evidence:

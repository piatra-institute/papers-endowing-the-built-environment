  - id: return-shock-terminal-gap
    kind: computation
    passage: "The stress comparisons prevent the smooth baseline from becoming a promise. Replacing one financial-portfolio return with a 35% loss in year 19 produces overdue work by year 60 and a final continuation gap of EUR 4.659 million. Moving the loss to year 21 changes the result even though the sequence contains the same annual return values. Payments occurring between the two dates make investment sequence matter."
    evidence:
      file: "simulation/output/results.json"
      run_id: "renewal"
      pointer: "/scenarios/return_before/financial/terminal_liquid_gap"
      reported: "4.659"
      scale: 0.000001
      decimals: 3
      units: "real EUR"
      conditions: "One financial return replaced by -35% in year 19; otherwise baseline no-call assumptions."
  - id: sequence-stress
    kind: assumption
    passage: "The stress comparisons prevent the smooth baseline from becoming a promise. Replacing one financial-portfolio return with a 35% loss in year 19 produces overdue work by year 60 and a final continuation gap of EUR 4.659 million. Moving the loss to year 21 changes the result even though the sequence contains the same annual return values. Payments occurring between the two dates make investment sequence matter."
    rationale: "One -35% year replaces +4% at year 19 or 21; designed comparison, not an estimated frequency. Intermediate expenditure makes ordering consequential."
  - id: rental-stress-first-overdue
    kind: computation
    passage: "The same-building exposure is tested by requiring an early roof replacement and reducing rental income during the same period. All treatments face the physical intervention; only the rental-funded account suffers the associated income loss. In that scenario the rental treatment first leaves work overdue in year 40. The assumed correlation is a designed stress, not an estimated frequency, but it identifies an exposure that a comparison of average yields would miss."
    evidence:
      file: "simulation/output/results.json"
      run_id: "renewal"
      pointer: "/scenarios/rental_failure/rental/first_overdue_year"
      reported: "40"
      scale: 1
      decimals: 0
      units: "simulation year"
      conditions: "Roof due at year 12 for all schemes; rental income halved years 12-14, other assumptions baseline."
  - id: correlated-stress
    kind: assumption
    passage: "The same-building exposure is tested by requiring an early roof replacement and reducing rental income during the same period. All treatments face the physical intervention; only the rental-funded account suffers the associated income loss. In that scenario the rental treatment first leaves work overdue in year 40. The assumed correlation is a designed stress, not an estimated frequency, but it identifies an exposure that a comparison of average yields would miss."
    rationale: "Common early physical expense and rental-specific interruption intentionally coupled; no causal covariance is estimated."
  - id: approval-overdue
    kind: computation
    passage: "Approval can fail independently of funding. A two-year decision delay leaves the financial treatment with more terminal cash than in its timely-work baseline and with 12 overdue component-years. Some work has moved beyond the reporting date. It would be perverse to call the larger balance better performance. The continuation assessment helps reveal the displaced expense; the overdue-work count reveals the interruption to the plan."
    evidence:
